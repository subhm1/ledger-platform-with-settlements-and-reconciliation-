spring.application.name=ledger-platform

spring.datasource.url=${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger?options=-c%20TimeZone=Asia/Kolkata}
spring.datasource.username=${LEDGER_DB_USER:ledger_runtime}
spring.datasource.password=${LEDGER_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.url=${LEDGER_FLYWAY_URL:jdbc:postgresql://localhost:5432/ledger?options=-c%20TimeZone=Asia/Kolkata}
spring.flyway.user=${LEDGER_FLYWAY_USER:ledger_migrator}
spring.flyway.password=${LEDGER_FLYWAY_PASSWORD}
spring.flyway.init-sqls=SET ROLE ledger_owner
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
ledger.security.username=${LEDGER_OPERATOR_USERNAME:}
ledger.security.password=${LEDGER_OPERATOR_PASSWORD:}
ledger.razorpay.key-id=${LEDGER_RAZORPAY_KEY_ID:}
ledger.razorpay.api-secret=${LEDGER_RAZORPAY_API_SECRET:}
ledger.razorpay.webhook-secret=${LEDGER_RAZORPAY_WEBHOOK_SECRET:}
