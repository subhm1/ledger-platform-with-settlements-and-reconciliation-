services:
  postgres:
    image: postgres:18
    container_name: ledger-postgres
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_app -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
